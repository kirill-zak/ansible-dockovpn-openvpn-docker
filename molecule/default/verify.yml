---
- name: Verify
  hosts: all
  tasks:
    - name: Get information about the OpenVPN configuration volume
      community.docker.docker_volume_info:
        name: dockovpn_openvpn_configuration
      register: dockovpn_configuration_status

    - name: Does the OpenVPN configuration volume exist?
      ansible.builtin.assert:
        that:
          - dockovpn_configuration_status.exists

    - name: Get information about the OpenVPN container
      community.docker.docker_container_info:
        name: dockovpn_openvpn
      register: dockovpn_container_status

    - name: Does the OpenVPN container exist?
      ansible.builtin.assert:
        that:
          - dockovpn_container_status.exists

    - name: Is the OpenVPN container running?
      ansible.builtin.assert:
        that:
          - dockovpn_container_status.container.State.Running